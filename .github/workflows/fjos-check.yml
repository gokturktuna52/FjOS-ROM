name: FjOS GSI Check

on:
  workflow_dispatch:
  push:
    paths:
      - "fjos/**"
      - ".github/workflows/fjos-check.yml"

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: FjOS files
        run: |
          echo "===== FJOS ====="
          find fjos -type f -print
          echo
          cat fjos/product/fjos_arm64.mk
          echo
          cat fjos/product/AndroidProducts.mk

      - name: FjOS GSI OK
        run: |
          echo "🔥 FjOS ARM64 GSI kaynak katmani bulundu"
          echo "🔥 BUILD CHECK BASARILI"

      - name: Package
        run: tar -czf FjOS-GSI-0.1.tar.gz fjos/

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: FjOS-GSI-0.1
          path: FjOS-GSI-0.1.tar.gz
