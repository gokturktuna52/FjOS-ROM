name: FjOS GSI Check

on:
  workflow_dispatch:
  push:

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: FjOS Check
        run: |
          echo "🔥 FjOS repository checkout OK"
          echo "🔥 FjOS GSI pipeline OK"

      - name: Package repository
        run: |
          tar --exclude=.git -czf FjOS-GSI-source.tar.gz .

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: FjOS-GSI-source
          path: FjOS-GSI-source.tar.gz
